<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B5320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Ground">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Home Ground</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --green: #4B5320; --green-dark: #363C17; --brown: #B45F0C; --ink: #3A301D;
    --paper: #FAF7F0; --card: #FFFFFF; --line: #DDD5C6; --muted: #6B6255;
    --warn-bg: #FFF4DC; --warn: #8A5A00; --bad-bg: #FCE8E6; --bad: #A12A1F; --ok-bg: #EEF0E0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 8px 0 14px; }
  header.top img { width: 52px; height: 52px; }
  header.top .who { font-weight: 700; font-size: 18px; }
  header.top .sub { color: var(--muted); font-size: 14px; }
  h1 { font-size: 24px; margin: 4px 0 12px; }
  h2 { font-size: 19px; margin: 22px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  .big { display: block; width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 18px;
    margin: 10px 0; background: var(--green); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; }
  .big small { display: block; font-weight: 400; font-size: 14px; opacity: .9; margin-top: 2px; }
  .big.alt { background: var(--brown); }
  .big:disabled { background: #B9B2A6; }
  button.plain { background: none; border: 0; color: var(--green); font-size: 16px; padding: 10px 0; cursor: pointer; text-decoration: underline; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .hint { color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 2px; }
  input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], input[type=password], select, textarea {
    width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 90px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line);
    border-radius: 10px; margin: 8px 0; background: #fff; font-weight: 400; }
  .choice input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; }
  .submit { width: 100%; border: 0; border-radius: 14px; padding: 18px; margin: 22px 0 8px;
    background: var(--green); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; }
  .submit:disabled { opacity: .5; }
  .note { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 15px; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note.ok { background: var(--ok-bg); color: var(--green-dark); }
  .status { font-size: 14px; color: var(--muted); }
  .pill { display: inline-block; font-size: 13px; padding: 2px 9px; border-radius: 99px; background: var(--ok-bg); color: var(--green-dark); }
  .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .err { color: var(--bad); font-size: 14px; margin-top: 4px; }
  .center { text-align: center; }
  .login-logo { width: 220px; max-width: 70%; margin: 24px auto 8px; display: block; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; margin: 6px 6px 0 0; border: 1px solid var(--line); }
  #msgs { max-height: 55vh; overflow-y: auto; }
  .bubble { max-width: 85%; padding: 10px 12px; border-radius: 14px; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.mine { background: var(--green); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bubble.theirs { background: #F3EFE6; border-bottom-left-radius: 4px; }
  .bubble .meta { font-size: 12px; opacity: .8; margin-top: 4px; }
  .compass { text-align: center; margin: 8px 0 4px; }
  .dial { position: relative; width: 260px; height: 260px; margin: 8px auto; border-radius: 50%; border: 3px solid var(--line); background: var(--card); }
  .dial .north { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; line-height: 24px;
    font-weight: 700; color: var(--brown); transform: translateY(-118px); transition: transform .2s linear; }
  .dial svg { position: absolute; left: 40px; top: 40px; width: 180px; height: 180px; transition: transform .2s linear; }
  .dial svg path { fill: var(--green); }
  .dial svg.close path { fill: var(--brown); opacity: .55; }
  .compass .dist { font-size: 40px; font-weight: 800; margin-top: 6px; }
  .compass .dir { font-size: 18px; margin: 2px 0 4px; }
  body.night, body.night main { background: #000 !important; color: #c22 !important; }
  body.night .dial { background: #000; border-color: #511; }
  body.night .dial svg path, body.night .dial svg.close path { fill: #c22; }
  body.night .dial .north, body.night .status, body.night .hint, body.night label { color: #a11 !important; }
  body.night header.top, body.night .big, body.night select, body.night .note, body.night button.plain { background: #120000 !important; color: #c22 !important; border-color: #400 !important; }
  body.night img { opacity: .25; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"><p class="center status">Loading…</p></main>
<script src="config.js"></script>
<script src="push.js"></script>
<script src="app.js"></script>
</body>
</html>
